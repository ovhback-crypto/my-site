<head>

    <link rel="icon" href="data:image/x-icon;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow: hidden; background-color: #050914; }

        /* Видео-фон */
        #video-bg-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        #video-bg-container.visible { opacity: 1; }
        #video-bg { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) contrast(1.1); }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, transparent 0%, rgba(5, 9, 20, 0.8) 100%); }

        /* Снег */
        .snow-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
        .snowflake { position: absolute; top: -10px; color: #fff; font-size: 14px; opacity: 0.6; animation: fall linear infinite; }
        @keyframes fall { 0% { transform: translateY(-10px) rotate(0deg); opacity: 0; } 10% { opacity: 0.8; } 100% { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

        /* Интро */
        #intro-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.8s ease, visibility 0.8s ease; background: #050914; }
        #intro-screen::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('intro.jpg'); background-size: cover; background-position: center; filter: blur(12px) brightness(0.3); z-index: -1; }
        .intro-content { text-align: center; animation: pulse 2s infinite; z-index: 1; }
        .intro-text { font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 800; color: #e0f0ff; text-shadow: 0 4px 15px rgba(0, 150, 255, 0.5); letter-spacing: 1px; margin-bottom: 10px; }
        .intro-sub { font-size: 13px; color: #88bbdd; letter-spacing: 2px; text-transform: uppercase; font-weight: 500;}
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 0.7; } }
        .intro-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* Основной сайт */
        #main-site { opacity: 0; visibility: hidden; transition: opacity 1s ease, transform 1s ease; display: flex; flex-direction: column; align-items: center; width: 100%; transform: translateY(20px); position: relative; z-index: 2; }
        #main-site.active { opacity: 1; visibility: visible; transform: translateY(0); }

        /* Гирлянда */
        .garland { display: flex; gap: 15px; margin-bottom: -10px; position: relative; z-index: 3; justify-content: center; padding: 0 20px; }
        .bulb { width: 12px; height: 12px; border-radius: 50%; position: relative; animation: blink 1.5s infinite alternate; }
        .bulb::before { content: ''; position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 2px; height: 8px; background: rgba(255,255,255,0.2); }
        .bulb:nth-child(1) { background: #ff3b3b; box-shadow: 0 0 15px #ff3b3b; animation-delay: 0s; }
        .bulb:nth-child(2) { background: #3bff75; box-shadow: 0 0 15px #3bff75; animation-delay: 0.2s; }
        .bulb:nth-child(3) { background: #ffcc00; box-shadow: 0 0 15px #ffcc00; animation-delay: 0.4s; }
        .bulb:nth-child(4) { background: #3b8aff; box-shadow: 0 0 15px #3b8aff; animation-delay: 0.6s; }
        .bulb:nth-child(5) { background: #ff3b3b; box-shadow: 0 0 15px #ff3b3b; animation-delay: 0.8s; }
        .bulb:nth-child(6) { background: #3bff75; box-shadow: 0 0 15px #3bff75; animation-delay: 1.0s; }
        .bulb:nth-child(7) { background: #ffcc00; box-shadow: 0 0 15px #ffcc00; animation-delay: 1.2s; }
        @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.2; } }

        .card-wrapper { position: relative; width: 100%; max-width: 600px; border-radius: 18px; padding: 2px; background: linear-gradient(135deg, rgba(255, 60, 60, 0.6), rgba(100, 180, 255, 0.2), rgba(60, 255, 100, 0.6)); box-shadow: 0 0 30px rgba(100, 180, 255, 0.15); }
        .card { background: rgba(10, 20, 35, 0.7); border-radius: 16px; padding: 24px; width: 100%; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
        
        /* АВАТАРКА (PNG) */
        .avatar { 
            width: 72px; height: 72px; border-radius: 50%; 
            background-image: url('avatar.png'); 
            background-size: cover; background-position: center; 
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); 
        }
        
        .profile-info h1 { font-family: 'Montserrat', sans-serif; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 15px rgba(200, 230, 255, 0.6); }
        
        .links-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; margin-top: 10px; }
        .link-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; transition: 0.2s; }
        .link-card:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .link-icon { width: 32px; height: 32px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .link-info h3 { font-size: 14px; font-weight: 600; }
        
        .socials { display: flex; justify-content: center; gap: 20px; margin-bottom: 24px; }
        .social-icon { width: 36px; height: 36px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: 0.2s; text-decoration: none; }
        .social-icon:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.1); }
        .social-icon svg { width: 20px; height: 20px; fill: #fff; }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: linear-gradient(90deg, rgba(255, 60, 60, 0.2), rgba(60, 255, 100, 0.2)); border-radius: 20px; font-size: 11px; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        
        .music-wrapper { width: 100%; max-width: 600px; border-radius: 14px; padding: 1px; margin-top: 20px; background: linear-gradient(90deg, rgba(255, 60, 60, 0.4), rgba(60, 255, 100, 0.4)); }
        .music-player { background: rgba(10, 20, 35, 0.8); border-radius: 13px; padding: 12px 16px; display: flex; align-items: center; gap: 16px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .album-art { width: 48px; height: 48px; border-radius: 8px; background-image: url('album.jpg'); background-size: cover; border: 1px solid rgba(255,255,255,0.3); }
        .player-info { flex: 1; overflow: hidden; }
        .player-info h4 { font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 10px; color: #ccc; }
        .progress-track { flex: 1; height: 3px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; cursor: pointer; }
        .progress-track:hover .progress-knob { opacity: 1; }
        .progress-knob { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: #fff; border-radius: 50%; opacity: 0; transition: opacity 0.1s; box-shadow: 0 0 8px #fff;}
        .progress-fill { width: 0%; height: 100%; background: #fff; border-radius: 2px; pointer-events: none; box-shadow: 0 0 5px #fff;}
        
        .controls { display: flex; gap: 12px; align-items: center; }
        .controls svg { width: 18px; height: 18px; fill: #fff; cursor: pointer; }
        .volume-container { display: flex; align-items: center; gap: 8px; }
        .volume-slider { -webkit-appearance: none; width: 60px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }
    </style>

    <!-- ЛОКАЛЬНАЯ МУЗЫКА -->
    <audio id="audio-player" src="music.mp3" loop></audio>

    <script>
        const snowContainer = document.getElementById('snow');
        for (let i = 0; i < 40; i++) {
            let snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.innerHTML = '❅';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = (Math.random() * 4 + 3) + 's';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            snowflake.style.fontSize = (Math.random() * 12 + 8) + 'px';
            snowflake.style.opacity = Math.random() * 0.5 + 0.3;
            snowContainer.appendChild(snowflake);
        }

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-pause');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const progressKnob = document.getElementById('progress-knob');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');
        
        const introScreen = document.getElementById('intro-screen');
        const mainSite = document.getElementById('main-site');
        const videoContainer = document.getElementById('video-bg-container');

        let isDragging = false;

        function updatePlayIcon() {
            playBtn.innerHTML = audio.paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }

        introScreen.addEventListener('click', () => {
            introScreen.classList.add('intro-hidden');
            mainSite.classList.add('active');
            videoContainer.classList.add('visible');
            
            // ГРОМКОСТЬ 25% ПРИ СТАРТЕ
            audio.volume = 0.25;
            audio.play().then(() => updatePlayIcon()).catch(e => console.log(e));
        });

        playBtn.addEventListener('click', (e) => {
            e.stopPropagation(); 
            if (audio.paused) { audio.play(); } else { audio.pause(); }
            updatePlayIcon();
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
            volumeIcon.innerHTML = audio.volume == 0 ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>' : (audio.volume < 0.5 ? '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>' : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>');
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isDragging) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                progressKnob.style.left = percent + '%';
                
                let cM = Math.floor(audio.currentTime / 60), cS = Math.floor(audio.currentTime % 60);
                currentTimeEl.innerText = `${cM}:${cS < 10 ? '0' + cS : cS}`;
                let dM = Math.floor(audio.duration / 60), dS = Math.floor(audio.duration % 60);
                durationEl.innerText = `${dM}:${dS < 10 ? '0' + dS : dS}`;
            }
        });

        progressBar.addEventListener('mousedown', (e) => { isDragging = true; seek(e); });
        window.addEventListener('mousemove', (e) => { if (isDragging) seek(e); });
        window.addEventListener('mouseup', () => { isDragging = false; });

        function seek(e) {
            if (!audio.duration) return;
            const rect = progressBar.getBoundingClientRect();
            let pos = (e.clientX - rect.left) / rect.width;
            pos = Math.max(0, Math.min(1, pos));
            audio.currentTime = pos * audio.duration;
            progressFill.style.width = (pos * 100) + '%';
            progressKnob.style.left = (pos * 100) + '%';
        }
    </script>
